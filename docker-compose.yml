name: ${COMPOSE_PROJECT_NAME:-bisakerja-scraper}

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/bisa-kerja/bisakerja-scraper:develop}
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:${PORT:-8000}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; port=os.environ.get('PORT', '8000'); urllib.request.urlopen('http://127.0.0.1:%s/health/live' % port, timeout=3).read()\""
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

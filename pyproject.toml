[project]
name = "bisakerja-scraper"
version = "0.1.0"
description = "Bisakerja job ingestion, normalization, enrichment, and sync service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18.4",
  "apscheduler>=3.11.2",
  "asyncpg>=0.31.0",
  "fastapi>=0.136.1",
  "httpx>=0.28.1",
  "openai>=2.33.0",
  "pydantic>=2.13.3",
  "pydantic-settings>=2.14.0",
  "selectolax>=0.4.7",
  "sqlalchemy>=2.0.49",
  "structlog>=25.5.0",
  "tenacity>=9.1.4",
  "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
  "ruff>=0.15.12",
]
test = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
]

[tool.uv]
package = false
default-groups = ["dev", "test"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "N",
  "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

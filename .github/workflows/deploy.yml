name: Deploy Scraper

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: Branch to deploy
        required: true
        default: develop
        type: string

concurrency:
  group: deploy-scraper
  cancel-in-progress: false

env:
  CONTAINER_REGISTRY: ghcr.io
  COMPOSE_FILE: docker-compose.yml
  RUNTIME_ENV_FILE: .env.production
  DEFAULT_APP_PORT: "8000"
  DEPLOY_TARGET: staging
  EXPECTED_APP_ENV: staging
  COMPOSE_PROJECT_NAME: bisakerja-scraper

jobs:
  build-and-push:
    name: Build And Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    outputs:
      deploy_branch: ${{ steps.meta.outputs.deploy_branch }}
      image_name: ${{ steps.meta.outputs.image_name }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_branch_tag: ${{ steps.meta.outputs.image_branch_tag }}
      image_sha_tag: ${{ steps.meta.outputs.image_sha_tag }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
      source_sha: ${{ steps.meta.outputs.source_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_branch || github.ref }}

      - name: Resolve image metadata
        id: meta
        run: |
          set -euo pipefail

          deploy_branch="${{ github.event_name == 'workflow_dispatch' && inputs.deploy_branch || github.ref_name }}"

          case "$deploy_branch" in
            develop|main)
              ;;
            *)
              echo "::error::Unsupported deploy branch: $deploy_branch"
              exit 1
              ;;
          esac

          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_branch_tag="$deploy_branch"
          source_sha="$(git rev-parse HEAD)"
          image_sha_tag="sha-$source_sha"
          image_tag="$image_sha_tag"

          {
            echo "deploy_branch=$deploy_branch"
            echo "image_name=$image_name"
            echo "image_tag=$image_tag"
            echo "image_branch_tag=$image_branch_tag"
            echo "image_sha_tag=$image_sha_tag"
            echo "image_ref=$image_name:$image_tag"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_branch_tag }}
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy To Server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build-and-push
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build-and-push.outputs.source_sha }}

      - name: Validate required deployment secrets
        env:
          DEPLOY_VPS_HOST: ${{ secrets.DEPLOY_VPS_HOST }}
          DEPLOY_VPS_PORT: ${{ secrets.DEPLOY_VPS_PORT }}
          DEPLOY_VPS_USERNAME: ${{ secrets.DEPLOY_VPS_USERNAME }}
          DEPLOY_VPS_KEY: ${{ secrets.DEPLOY_VPS_KEY }}
          DEPLOY_REMOTE_PATH: ${{ secrets.DEPLOY_REMOTE_PATH }}
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
          GHCR_READ_PACKAGES_TOKEN: ${{ secrets.GHCR_READ_PACKAGES_TOKEN }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
        run: |
          set -euo pipefail

          required=(
            DEPLOY_VPS_HOST
            DEPLOY_VPS_PORT
            DEPLOY_VPS_USERNAME
            DEPLOY_VPS_KEY
            DEPLOY_REMOTE_PATH
            DEPLOY_ENV_FILE
            GHCR_READ_PACKAGES_TOKEN
            GH_USERNAME
          )

          missing=0

          for secret_name in "${required[@]}"; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Missing required secret: ${secret_name}"
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.DEPLOY_VPS_HOST }}
          username: ${{ secrets.DEPLOY_VPS_USERNAME }}
          key: ${{ secrets.DEPLOY_VPS_KEY }}
          port: ${{ secrets.DEPLOY_VPS_PORT }}
          timeout: 60s
          command_timeout: 20m
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            REMOTE_PATH="${{ secrets.DEPLOY_REMOTE_PATH }}"
            RUNTIME_ENV_FILE="${{ env.RUNTIME_ENV_FILE }}"

            install -d -m 755 "$REMOTE_PATH"
            cat <<'EOF' > "$REMOTE_PATH/$RUNTIME_ENV_FILE"
            ${{ secrets.DEPLOY_ENV_FILE }}
            EOF
            chmod 600 "$REMOTE_PATH/$RUNTIME_ENV_FILE"

            cd "$REMOTE_PATH"

            printf '%s' '${{ secrets.GHCR_READ_PACKAGES_TOKEN }}' | docker login ghcr.io -u '${{ secrets.GH_USERNAME }}' --password-stdin

            bash scripts/deploy/remote-deploy.sh \
              "$REMOTE_PATH" \
              "${{ needs.build-and-push.outputs.deploy_branch }}" \
              "${{ needs.build-and-push.outputs.source_sha }}" \
              "${{ needs.build-and-push.outputs.image_name }}" \
              "${{ needs.build-and-push.outputs.image_tag }}" \
              "${{ env.DEFAULT_APP_PORT }}" \
              "${{ env.COMPOSE_FILE }}" \
              "${{ env.RUNTIME_ENV_FILE }}" \
              "${{ env.DEPLOY_TARGET }}" \
              "${{ env.EXPECTED_APP_ENV }}" \
              "${{ env.COMPOSE_PROJECT_NAME }}"

      - name: Collect remote diagnostics on failure
        if: failure()
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.DEPLOY_VPS_HOST }}
          username: ${{ secrets.DEPLOY_VPS_USERNAME }}
          key: ${{ secrets.DEPLOY_VPS_KEY }}
          port: ${{ secrets.DEPLOY_VPS_PORT }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set +e
            cd "${{ secrets.DEPLOY_REMOTE_PATH }}"
            export PORT="${{ env.DEFAULT_APP_PORT }}" APP_PORT="${{ env.DEFAULT_APP_PORT }}" COMPOSE_PROJECT_NAME="${{ env.COMPOSE_PROJECT_NAME }}"
            docker compose -f "${{ env.COMPOSE_FILE }}" --env-file "${{ env.RUNTIME_ENV_FILE }}" ps
            docker compose -f "${{ env.COMPOSE_FILE }}" --env-file "${{ env.RUNTIME_ENV_FILE }}" logs --tail=100 app

name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_LOCKED: "1"
      PYTHONPATH: src

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
          enable-cache: true

      - name: Install dependencies from lockfile
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Contract tests
        run: uv run pytest tests/contract

      - name: Integration tests
        run: uv run pytest tests/integration

      - name: Smoke tests
        run: uv run pytest tests/smoke

      - name: Smoke CLI
        run: |
          uv run python -m cli.smoke config --env-file .env.example
          uv run python -m cli.smoke health --env-file .env.example
          uv run python -m cli.smoke dry-run --source dealls

      - name: Release readiness checks
        run: uv run python scripts/check_release_readiness.py

  sync-docs:
    name: Sync Service Docs To Central Repo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare docs sync bundle (.md -> .mdx)
        run: |
          python scripts/prepare_docs_sync_bundle.py \
            --source-ref "${{ github.ref_name }}" \
            --source-sha "${{ github.sha }}"

      - name: Push docs to bisakerja-docs develop
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.DOCS_REPO_TOKEN }}
        with:
          source-directory: .tmp/docs-sync
          destination-github-username: bisa-kerja
          destination-repository-name: bisakerja-docs
          user-email: github-actions[bot]@users.noreply.github.com
          user-name: github-actions[bot]
          commit-message: >-
            sync: scraper-api docs from ${{ github.ref_name }} (${{ github.sha }})
          target-directory: docs/services/scraper-api/synced
          target-branch: develop
